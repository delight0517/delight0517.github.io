name: SEO Auto-Ping & Indexing Automation

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'scripts/indexnow_ping.py'
      - '.github/workflows/seo_autopush.yml'
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 자정에 정기적으로 한 번 더 핑 전송 (방치 방지)
  workflow_dispatch: # GitHub 웹사이트에서 수동으로 버튼을 눌러서 실행 가능

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: 🔎 현재 커밋의 사이트맵 배포 확인
        env:
          SITEMAP_URL: "https://delight0517.github.io/sitemap.xml?v=${{ github.sha }}"
        run: |
          python - <<'PY'
          import os, time, urllib.request, xml.etree.ElementTree as ET
          from pathlib import Path

          def urls(data):
              root = ET.fromstring(data)
              return {node.text for node in root.iter() if node.tag.endswith("}loc") and node.text}

          expected = urls(Path("sitemap.xml").read_bytes())
          if not expected:
              raise SystemExit("Repository sitemap has no URLs")
          url = os.environ["SITEMAP_URL"]
          deadline = time.monotonic() + 240
          while True:
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      published = urls(response.read())
                  missing = expected - published
                  if not missing:
                      print(f"Published sitemap includes all {len(expected)} repository URLs.")
                      break
                  status = f"{len(missing)} repository URLs are not live yet"
              except Exception as error:
                  status = f"Public sitemap is not ready: {error}"
              if time.monotonic() >= deadline:
                  raise SystemExit(f"Timed out waiting for the committed sitemap: {status}")
              print(f"{status}; retrying in 10 seconds")
              time.sleep(10)
          PY

      - name: 🚀 IndexNow (Bing/Yandex 등) 자동 색인 전송
        env:
          INDEXNOW_SITEMAP_URL: "https://delight0517.github.io/sitemap.xml?v=${{ github.sha }}"
        run: |
          echo "IndexNow 프로토콜을 통해 즉각 색인을 요청합니다..."
          if [ -f "scripts/indexnow_ping.py" ]; then
            python scripts/indexnow_ping.py
          else
            echo "indexnow_ping.py 스크립트가 없습니다."
          fi

      # 추후 Google Indexing API (GCP 서비스 계정) 연동 시 여기에 단계 추가 가능
