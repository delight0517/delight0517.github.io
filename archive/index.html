<body><p><a href="/">김근후의 앱·웹 작업 아카이브로 이동</a></p>
<style>
.geunhu-service-cta{box-sizing:border-box;width:min(1120px,calc(100% - 40px));margin:clamp(48px,8vw,96px) auto 32px;padding:clamp(22px,4vw,36px);display:flex;align-items:center;justify-content:space-between;gap:24px;border:1px solid rgba(127,127,127,.3);border-radius:22px;background:rgba(127,127,127,.08);font-family:inherit;color:inherit}
.geunhu-service-cta__eyebrow{margin:0 0 8px;font-size:12px;letter-spacing:.12em;opacity:.72}

.geunhu-service-cta__link{display:inline-flex;flex:none;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;background:#185c49;color:#fff;text-decoration:none;font-size:14px;font-weight:700;transition:transform .18s,background .18s}
.geunhu-service-cta__link:hover{transform:translateY(-2px);background:#104735}

</style>
<section class="geunhu-service-cta" aria-labelledby="geunhu-service-cta-title"><div><p class="geunhu-service-cta__eyebrow" id="geunhu-service-cta-eyebrow">비슷한 서비스가 필요하신가요?</p><h2 id="geunhu-service-cta-title">나도 이와 같은 서비스가 필요하다면?</h2></div><a class="geunhu-service-cta__link" id="geunhu-service-cta-link" href="https://launchmate-app-builders.rogan2534.chatgpt.site/#contact">제작 의뢰 맡기기! ↗</a></section>
<script>(()=>{const text={ko:['비슷한 서비스가 필요하신가요?','나도 이와 같은 서비스가 필요하다면?','제작 의뢰 맡기기! ↗'],en:['NEED A SIMILAR SERVICE?','Want a website or app like this?','Request a project ↗'],ja:['似たサービスをお探しですか？','同じようなウェブサイトやアプリも制作できます。','制作を依頼する ↗'],zh:['也需要类似的服务吗？','想制作类似的网站或应用？','提交制作委托 ↗'],es:['¿Necesitas un servicio parecido?','¿Quieres una web o app como esta?','Solicitar proyecto ↗']};const locale=(document.documentElement.lang||navigator.languages?.[0]||navigator.language||'ko').toLowerCase().split('-')[0],copy=text[locale]||text.ko;document.getElementById('geunhu-service-cta-eyebrow').textContent=copy[0];document.getElementById('geunhu-service-cta-title').textContent=copy[1];document.getElementById('geunhu-service-cta-link').textContent=copy[2]})();</script>
